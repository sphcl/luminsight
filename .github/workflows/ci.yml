name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Verificação contínua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos TypeScript
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Falha em qualquer high/critical fora dos riscos aceitos em docs/seguranca.md.
      - name: Auditoria de segurança das dependências
        run: npm run audit:check

      # Falha se a cobertura cair abaixo dos mínimos do vite.config.ts (80% em segurança e engines, 60% no resto).
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Configurar Java (emulador do Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Testes das Firestore Rules
        run: npm run test:rules

      - name: Build de produção
        run: npm run build