name: CI

# PR entra pelo pull-request.yml e a main pelo deploy.yml, os dois chamam este aqui; assim não roda duas vezes.
on:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Verificação contínua
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos TypeScript
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Falha em qualquer high/critical fora dos riscos aceitos em docs/seguranca.md.
      - name: Auditoria de segurança das dependências
        run: npm run audit:check

      # Falha se a cobertura cair abaixo dos mínimos do vite.config.ts (80% em segurança e engines, 60% no resto).
      - name: Testes com cobertura
        run: npm run test:coverage

      - name: Configurar Java (emulador do Firestore)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Testes das Firestore Rules
        run: npm run test:rules

      # O Vite cola essas variáveis no JS na hora do build; são públicas, ver docs/seguranca.md seção 9.1.
      - name: Build de produção
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # O deploy publica exatamente este dist, o que passou pelos testes, em vez de buildar de novo.
      - name: Guardar o build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
